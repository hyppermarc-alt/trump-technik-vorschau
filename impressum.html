@font-face{font-family:"STIX Two Text";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/YA9Vr02F12Xkf5whdwKf11l0p76Mi93T_dE.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:16px;background:#141719;color:#e6e6e2;
  font-family:"STIX Two Text","Times New Roman",Georgia,serif;-webkit-font-smoothing:antialiased}
body.checking .card{visibility:hidden}
.card{width:min(100%,440px);padding:36px 28px 32px;background:#1d2124}
.logo{display:block;width:168px;height:44px;margin-bottom:32px;background:#e6e6e2;
  -webkit-mask:url(img/tts-logo-desktop.png) left center/contain no-repeat;mask:url(img/tts-logo-desktop.png) left center/contain no-repeat}
h1{margin:0 0 10px;font-weight:400;font-size:2rem;line-height:1.1;letter-spacing:-.026em}
p{margin:0 0 26px;font-size:1.0625rem;line-height:1.5;color:#a3a7a8}
label{display:block;font-size:.9375rem;color:#a3a7a8;margin-bottom:8px}
input[type=password]{width:100%;min-height:3.25rem;padding:.7rem .9rem;font:inherit;font-size:1.0625rem;color:#e6e6e2;background:#141719;
  border:1px solid #272c30;border-radius:0;outline:none;caret-color:#2f86f6}
input[type=password]:focus{border-color:#2f86f6}
.remember{display:flex;align-items:center;gap:10px;color:#e6e6e2;margin:16px 0 22px;cursor:pointer;min-height:2.75rem}
.remember input{width:1.2rem;height:1.2rem;accent-color:#2f86f6}
button{width:100%;min-height:3.5rem;border:0;border-radius:0;background:#2f86f6;color:#0b0d0e;font:inherit;font-size:1.125rem;cursor:pointer;
  transition:background-color .18s ease,transform .14s cubic-bezier(.22,1,.36,1)}
button:hover{background:#4b97f8}
button:active{transform:scale(.98)}
button:disabled{opacity:.7;cursor:wait}
button:focus-visible{outline:2px solid #e6e6e2;outline-offset:3px}
.err{margin:16px 0 0;color:#ff8a8d}
::selection{background:#2f86f6;color:#0b0d0e}
</style>
</head>

    <label class="remember"><input type="checkbox" id="remember" checked> Angemeldet bleiben</label>
    <button type="submit" id="go">Vorschau öffnen</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>

  const STORE = "trump-technik-preview-key";
  const hex = (h) => new Uint8Array(h.match(/../g).map((b) => parseInt(b, 16)));
  const toHex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = {
    get() { try { return localStorage.getItem(STORE) || sessionStorage.getItem(STORE); } catch (e) { return null; } },

  const fail = (msg) => { const e = $("err"); e.textContent = msg; e.hidden = false; };

  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return toHex(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(P.salt), iterations: P.iter }, base, 256));
  }
  async function decrypt(keyHex) {
    try {
      const key = await crypto.subtle.importKey("raw", hex(keyHex), { name: "AES-CBC" }, false, ["decrypt"]);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: hex(P.iv) }, key, b64(P.data)));
      return /^<!doctype html>/i.test(html) ? html : null;
    } catch (e) { return null; }
  }
  // document.open() wird ignoriert, solange der Parser noch läuft – daher erst nach "load" ersetzen
  const ready = () => new Promise((resolve) => {
    if (document.readyState === "complete") resolve();
    else window.addEventListener("load", () => setTimeout(resolve, 0), { once: true });
  });
  async function show(html) {
    await ready(); document.open(); document.write(html); document.close();
    // Sprungmarken (#ersatzteile) nach dem Austausch des Dokuments anfahren
    if (location.hash) addEventListener("load", () => { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }, { once: true });
  }

  if (!window.crypto || !crypto.subtle) {
    document.body.classList.remove("checking");
    fail("Ihr Browser unterstützt die Entschlüsselung nicht. Bitte einen aktuellen Browser verwenden.");
    return;
  }

  (async () => {
    const saved = store.get();
    if (saved) {
      const html = await decrypt(saved);
      if (html) { await show(html); return; }
      store.clear();
    }
    document.body.classList.remove("checking");
    $("pw").focus();
  })();

  $("gate").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").hidden = true;
    $("go").disabled = true;
    $("go").textContent = "Wird geöffnet …";
    const key = await derive($("pw").value);
    const html = await decrypt(key);
    if (html) { store.set(key, $("remember").checked); await show(html); return; }
    $("go").disabled = false;
    $("go").textContent = "Vorschau öffnen";
    fail("Das Passwort ist leider nicht korrekt.");
    $("pw").select();
  });
