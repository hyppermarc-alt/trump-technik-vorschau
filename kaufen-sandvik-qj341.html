  const STORE = "trump-technik-preview-key";
  const hex = (h) => new Uint8Array(h.match(/../g).map((b) => parseInt(b, 16)));
  const toHex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = {
    get() { try { return localStorage.getItem(STORE) || sessionStorage.getItem(STORE); } catch (e) { return null; } },
    set(k, keep) { try { (keep ? localStorage : sessionStorage).setItem(STORE, k); } catch (e) {} },
    clear() { try { localStorage.removeItem(STORE); sessionStorage.removeItem(STORE); } catch (e) {} },
  };
  const $ = (id) => document.getElementById(id);
  const fail = (msg) => { const e = $("err"); e.textContent = msg; e.hidden = false; };

  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return toHex(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(P.salt), iterations: P.iter }, base, 256));
  }
  async function decrypt(keyHex) {
    try {
      const key = await crypto.subtle.importKey("raw", hex(keyHex), { name: "AES-CBC" }, false, ["decrypt"]);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: hex(P.iv) }, key, b64(P.data)));
      return /^<!doctype html>/i.test(html) ? html : null;
    } catch (e) { return null; }
  }
  // document.open() wird ignoriert, solange der Parser noch läuft – daher erst nach "load" ersetzen
  const ready = () => new Promise((resolve) => {
    if (document.readyState === "complete") resolve();
    else window.addEventListener("load", () => setTimeout(resolve, 0), { once: true });
  });
  async function show(html) {
    await ready(); document.open(); document.write(html); document.close();
    // Sprungmarken (#ersatzteile) nach dem Austausch des Dokuments anfahren
    if (location.hash) addEventListener("load", () => { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }, { once: true });
  }

  if (!window.crypto || !crypto.subtle) {
    document.body.classList.remove("checking");
    fail("Ihr Browser unterstützt die Entschlüsselung nicht. Bitte einen aktuellen Browser verwenden.");
    return;
  }

  (async () => {
    const saved = store.get();
    if (saved) {
      const html = await decrypt(saved);
      if (html) { await show(html); return; }
      store.clear();
    }
    document.body.classList.remove("checking");
    $("pw").focus();
  })();

  $("gate").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").hidden = true;
    $("go").disabled = true;
    $("go").textContent = "Wird geöffnet …";
    const key = await derive($("pw").value);
    const html = await decrypt(key);
    if (html) { store.set(key, $("remember").checked); await show(html); return; }
    $("go").disabled = false;
    $("go").textContent = "Vorschau öffnen";
    fail("Das Passwort ist leider nicht korrekt.");
    $("pw").select();
  });
})();
